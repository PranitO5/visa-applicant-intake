<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Concept prototype: a document-first work visa intake flow for applicants, by Pranit Jena.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='3' y='3' width='20' height='20' rx='3' fill='%231E2B45'/%3E%3Cpath d='M8 10h10M8 14h10M8 18h6' stroke='%23FBFAF7' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Visa Applicant Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Source+Sans+3:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: plain form shell — white header | step rail | working pane | document viewer. Palette and type from the U.S. Web Design System. */
:root{
  /* 60% soft paper neutrals · 30% navy-tinted slate · 10% navy, with muted ochre (navy's complement) reserved for 'please check' */
  --bg:#F5F4F0; --surface:#FBFAF7; --sunk:#EEECE6; --ink:#1A1D24; --muted:#4F5560; --line:#DAD7CE;
  --navy:#1E2B45; --navy-ink:#FBFAF7; --navy-muted:#4F5560; --stripe:#1E2B45;
  --accent:#1E2B45; --accent-ink:#FBFAF7; --accent-soft:#E4E8EF;
  --ok:#3B6A4E; --ok-soft:#E6EEE8; --warn:#865711; --warn-soft:#F5EBD8; --warn-edge:#C08A2E;
  --info:#3D4A61; --info-soft:#E8EBF0; --err:#9A2B2B;
  --paper:#FFFEFB; --paper-ink:#1A1D24; --paper-line:#D6D2C6; --hl:rgba(214,160,52,.32); --hl-line:#C08A2E;
  --display:"Merriweather", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
  --mono:"Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:4px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--body);font-weight:700;text-wrap:balance;margin:0}
h1{font-family:var(--display);color:var(--navy);font-size:clamp(1.45rem,1.15rem + 1.1vw,1.85rem);line-height:1.3}
h2{color:var(--navy)}
h2{font-size:1.1rem}
h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r)}

/* prototype band */
.proto{background:var(--sunk);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:7px}
.proto b{color:var(--ink);font-weight:600}
.proto .acts{display:flex;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* app header */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--ink);border-bottom:3px solid var(--navy)}
.head .in{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:1.08rem;letter-spacing:.01em}
.brand svg{width:26px;height:26px}
.case{color:var(--muted);font-size:13.5px;flex:1;min-width:0}
.case span{color:var(--ink);font-weight:600}
.save{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.save.saving i{background:var(--warn-edge)}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:28px 120px;max-width:1440px;margin:0 auto}
.shell.wp{grid-template-columns:230px minmax(0,1fr) 420px}
.rail{position:sticky;top:90px;align-self:start}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rail li button{all:unset;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r);width:100%;box-sizing:border-box;cursor:default;color:var(--muted);font-size:14px}
.rail li button .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 12px var(--mono);flex:none;background:var(--surface)}
.rail li.done button{cursor:pointer;color:var(--ink)}
.rail li.done button:hover{background:var(--sunk)}
.rail li.done .n{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.rail li.cur button{color:var(--accent);font-weight:700;background:var(--surface);box-shadow:inset 4px 0 0 var(--accent)}
.rail li.cur .n{border-color:var(--accent);color:var(--accent)}
.rail .meta{margin-top:18px;padding:12px 10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}

main{min-width:0}
.pane{max-width:760px;display:grid;gap:22px}
.lede{color:var(--muted);max-width:62ch;font-size:15.5px}
.eyebrow{font:700 12.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(30,43,69,.05)}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .cb{padding:16px 18px}
.card .cf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 var(--r) var(--r);flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r);padding:10px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:14.5px}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--accent);filter:none}
.btn.sm{padding:6px 12px;font-size:13px;font-weight:500}
.link{all:unset;color:var(--accent);cursor:pointer;font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* welcome */
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.need{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:grid;gap:6px}
.need svg{width:22px;height:22px;color:var(--navy)}
.need b{font-weight:600}
.need span{color:var(--muted);font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.facts div{padding:14px 16px 0 0;display:grid;gap:2px}
.facts b{font:700 1.15rem var(--display);color:var(--navy)}
.facts span{font-size:13px;color:var(--muted)}
.privacy{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-left:3px solid var(--navy);background:var(--accent-soft);font-size:13.5px;color:var(--muted)}
.privacy svg{flex:none;width:20px;height:20px;color:var(--navy);margin-top:1px}
.privacy b{color:var(--ink)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* documents */
.docs{display:grid;gap:12px}
.doccard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px}
.doccard .ic{width:44px;height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.doccard.done .ic{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.doccard .t{font-weight:600}
.doccard .d{font-size:13.5px;color:var(--muted)}
.doccard .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bar{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:8px;max-width:280px}
.bar i{display:block;height:100%;background:var(--accent);width:35%;animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.st{font-size:13px;display:inline-flex;align-items:center;gap:6px}
.st.ok{color:var(--ok)} .st.mut{color:var(--muted)}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:13.5px;color:var(--muted)}
.tips div{display:flex;gap:8px}
.tips svg{flex:none;width:16px;height:16px;color:var(--accent);margin-top:3px}

/* review */
.sum{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mut{background:var(--sunk);color:var(--muted)}
.pill svg{width:13px;height:13px}
.fields{display:grid}
.f{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.f .lb{font-size:13.5px;color:var(--muted)}
.f .lb small{display:block;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-top:2px}
.f .v{font-weight:500;overflow-wrap:anywhere}
.f .v .ed{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.f .a{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.f.crit{background:linear-gradient(90deg,var(--accent-soft),transparent 55%)}
.f .note{grid-column:1/-1;display:flex;gap:10px;font-size:13.5px;padding:10px 12px;border-radius:var(--r)}
.f .note svg{flex:none;width:17px;height:17px;margin-top:2px}
.note.info{background:var(--info-soft);color:var(--ink);border-left:4px solid var(--info);border-radius:0} .note.info svg{color:var(--info)}
.note.warn{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn-edge);border-radius:0} .note.warn svg{color:var(--warn)}
.src{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:3px 8px;font:500 11.5px var(--mono);color:var(--muted);cursor:pointer}
.src:hover,.src.on{border-color:var(--accent);color:var(--accent)}
.src svg{width:12px;height:12px}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.editrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editrow .inp{flex:1;min-width:160px}
.choices{grid-column:1/-1;display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--accent)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice b{font-weight:600}
.choice span{display:block;font-size:13px;color:var(--muted)}
.mismatch{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mismatch div{border:1px dashed var(--paper-line);background:var(--sunk);border-radius:var(--r);padding:10px 12px}
.mismatch small{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mismatch b{font-family:var(--mono);font-weight:500}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.foot .msg{font-size:13.5px;color:var(--muted)}
.foot .msg b{color:var(--ink)}

/* preview */
.preview{min-width:0}
.pv{position:sticky;top:90px;display:grid;gap:12px}
.pvh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:var(--r);padding:3px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:5px 10px;border-radius:var(--r);font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.pvcap{font-size:13px;color:var(--muted)}
.pvcap b{color:var(--ink)}
.x{all:unset;cursor:pointer;width:32px;height:32px;border-radius:var(--r);display:none;place-items:center;color:var(--muted)}
.x:hover{background:var(--sunk)}

.doc{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:var(--r);border:1px solid var(--paper-line);padding:16px;overflow:hidden;font-size:12px;box-shadow:0 1px 0 var(--paper-line),0 10px 24px -18px rgba(0,0,0,.4)}
.doc .wm{position:absolute;right:-18px;top:44%;transform:rotate(-24deg);font:600 34px var(--display);letter-spacing:.2em;color:rgba(0,0,0,.08);pointer-events:none}
.pp-top{display:flex;justify-content:space-between;font:600 11px var(--mono);letter-spacing:.12em;border-bottom:1px solid var(--paper-line);padding-bottom:8px;margin-bottom:12px;color:var(--paper-ink)}
.pp-body{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px}
.photo{width:86px;height:108px;border-radius:4px;background:linear-gradient(#D6D6D6,#BDBDBD);position:relative;overflow:hidden}
.photo::before{content:"";position:absolute;left:50%;top:22px;width:34px;height:34px;border-radius:50%;background:#9A9A9A;transform:translateX(-50%)}
.photo::after{content:"";position:absolute;left:50%;bottom:-24px;width:72px;height:56px;border-radius:50%;background:#9A9A9A;transform:translateX(-50%)}
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}
.pf div.w{grid-column:1/-1}
.pf small,.dl small{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#6B6658}
.pf b,.dl b{font:500 12.5px var(--mono)}
.k{border-radius:3px;transition:background .2s,box-shadow .2s}
.k.hl{background:var(--hl);box-shadow:0 0 0 2px var(--hl-line)}
.mrz{margin-top:14px;border-top:1px solid var(--paper-line);padding-top:10px;font:500 11.2px/1.5 var(--mono);letter-spacing:.06em;white-space:pre;overflow-x:auto}
.cert{text-align:center;display:grid;gap:8px;padding:10px 6px}
.cert .u{font:700 15px var(--display);color:var(--paper-ink)}
.cert .s{font-style:italic;color:#6B6658}
.cert .nm{font:600 18px var(--display)}
.letter{display:grid;gap:9px;font-size:12.5px;line-height:1.6}
.letter .lh{font:700 15px var(--display);color:var(--paper-ink);border-bottom:2px solid var(--paper-ink);padding-bottom:6px}

/* questions */
.q{display:grid;gap:10px;padding:18px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q label.ql{font-weight:600}
.why{font-size:13px;color:var(--muted);display:flex;gap:6px}
.why svg{flex:none;width:15px;height:15px;margin-top:2px;color:var(--accent)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent)}
.sub{display:grid;gap:10px;padding:14px;border-radius:var(--r);background:var(--sunk)}
.sub .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{color:var(--err);font-size:13px;font-weight:600}

/* submit */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.dl small{color:var(--muted)}
.dl b{font-family:var(--body);font-size:14.5px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.consent input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:500 12px var(--mono)}
.steps b{display:block}
.steps span{font-size:13.5px;color:var(--muted)}
.big-ok{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.big-ok svg{width:26px;height:26px}

/* notes drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 40px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .db{overflow-y:auto;padding:18px 20px 30px;display:grid;gap:18px;align-content:start}
.drawer .x{display:grid}
.dnote{display:grid;gap:6px}
.dnote h3{font-size:.95rem}
.dnote p{font-size:13.5px;color:var(--muted)}
.testbox{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--sunk)}
.toggle{display:flex;gap:10px;align-items:center;font-size:13.5px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.log{font:12px/1.55 var(--mono);color:var(--ink);display:grid;gap:4px}
.log .t{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.35);z-index:35}

/* responsive */
@media (max-width:1180px){
  .shell.wp{grid-template-columns:230px minmax(0,1fr)}
  .preview{position:fixed;left:0;right:0;bottom:0;z-index:25;max-height:82vh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -20px 40px -24px rgba(0,0,0,.45);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s ease}
  .preview.open{transform:none}
  .pv{position:static}
  .x{display:grid}
}
@media (max-width:820px){
  .shell,.shell.wp{grid-template-columns:minmax(0,1fr);gap:18px;padding-top:16px}
  .rail{position:static}
  .rail ol{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .rail li button{padding:6px 8px;white-space:nowrap;font-size:13px}
  .rail li:not(.cur) .lbl{display:none}
  .rail .meta{display:none}
  .needs,.facts,.tips{grid-template-columns:minmax(0,1fr)}
  .facts div{padding:10px 0 0}
  .f{grid-template-columns:minmax(0,1fr)}
  .f .a{justify-content:flex-start}
  .doccard{grid-template-columns:40px minmax(0,1fr)}
  .doccard .acts{grid-column:1/-1;justify-content:flex-start}
  .mismatch,.dl,.sub .two{grid-template-columns:minmax(0,1fr)}
  .case{flex-basis:100%;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="proto"><div class="in gut">
  <div><b>Concept prototype</b> · Pranit Jena · Sample data only, not a real product</div>
  <div class="acts">
    <button class="chipbtn" id="notesBtn" data-a="notes" aria-pressed="false">Design notes</button>
    <button class="chipbtn" data-a="restart">Restart</button>
  </div>
</div></div>

<header class="head"><div class="in gut">
  <div class="brand">
    <svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><rect x="3" y="5" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6" opacity=".5"/><rect x="8" y="2" width="15" height="19" rx="2" fill="currentColor"/><path d="M12 9h7M12 13h7M12 17h4" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/></svg>
    Applicant Intake
  </div>
  <div class="case">H-1B petition for <span>Priya Sharma</span> · Sponsored by <span>Northwind Labs, Inc.</span></div>
  <div class="save" id="save"><i></i><span>All changes saved</span></div>
</div></header>

<div class="shell gut" id="shell">
  <nav class="rail" id="rail" aria-label="Application steps"></nav>
  <main id="main"></main>
  <aside class="preview" id="preview" aria-label="Document viewer"></aside>
</div>
<div class="foot" id="foot" hidden><div class="in gut" id="footIn"></div></div>
<div class="scrim" id="scrim" hidden data-a="closeNotes"></div>
<aside class="drawer" id="drawer" hidden aria-label="Design notes"></aside>

<script>
const ICON = {
  check:'<svg viewBox="0 0 20 20" fill="none"><path d="M5 10.5l3.2 3.2L15 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn:'<svg viewBox="0 0 20 20" fill="none"><path d="M10 3l8 14H2L10 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4M10 14.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  info:'<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5M10 6.2v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  doc:'<svg viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5.5L13 5v9.5H4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 1.5V5h4" stroke="currentColor" stroke-width="1.3"/></svg>',
  lock:'<svg viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="8.5" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 9V6.5a3 3 0 016 0V9" stroke="currentColor" stroke-width="1.6"/></svg>',
  pass:'<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="2.5" width="14" height="19" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 16.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  cap:'<svg viewBox="0 0 24 24" fill="none"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.5 11v4.5c1.5 1.5 3.4 2.2 5.5 2.2s4-.7 5.5-2.2V11" stroke="currentColor" stroke-width="1.6"/></svg>',
  brief:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 7V5h6v2M3 12.5h18" stroke="currentColor" stroke-width="1.6"/></svg>',
  dot:'<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>',
  x:'<svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STEPS = ['Welcome','Your documents','Check details','A few questions','Review and send'];
const DOCS = {
  passport:{t:'Passport',d:'The page with your photo and details',file:'passport_photo_page.jpg',icon:'pass',found:8},
  degree:{t:'Degree certificate',d:'Your highest completed degree',file:'BE_degree_certificate.pdf',icon:'cap',found:4},
  offer:{t:'Offer letter',d:'The letter from Northwind Labs',file:'Northwind_offer_letter.pdf',icon:'brief',found:5}
};
const GROUPS = [{k:'about',t:'About you',src:'passport'},{k:'edu',t:'Education',src:'degree'},{k:'job',t:'Your new job',src:'offer'}];
const FIELDS = [
  {id:'name',g:'about',src:'passport',l:'Full name',crit:true,keys:{passport:['surname','given'],degree:['dname']}},
  {id:'dob',g:'about',src:'passport',l:'Date of birth',crit:true,keys:{passport:['dob','mrz']}},
  {id:'ppno',g:'about',src:'passport',l:'Passport number',v:'Z4831207',crit:true,keys:{passport:['ppno','mrz']}},
  {id:'pob',g:'about',src:'passport',l:'Place of birth',v:'Pune, Maharashtra, India',keys:{passport:['pob']}},
  {id:'sex',g:'about',src:'passport',l:'Sex',v:'Female',keys:{passport:['sex']}},
  {id:'nat',g:'about',src:'passport',l:'Nationality',v:'Indian',keys:{passport:['nat']}},
  {id:'doi',g:'about',src:'passport',l:'Passport issued',v:'15 Mar 2017',keys:{passport:['doi']}},
  {id:'doe',g:'about',src:'passport',l:'Passport expires',v:'14 Mar 2027',heads:true,keys:{passport:['doe']}},
  {id:'uni',g:'edu',src:'degree',l:'University',v:'Savitribai Phule Pune University',keys:{degree:['duni']}},
  {id:'deg',g:'edu',src:'degree',l:'Degree',v:'Bachelor of Engineering',keys:{degree:['ddeg']}},
  {id:'major',g:'edu',src:'degree',l:'Field of study',v:'Computer Engineering',keys:{degree:['dmajor']}},
  {id:'grad',g:'edu',src:'degree',l:'Completed',v:'June 2018',keys:{degree:['dgrad']}},
  {id:'emp',g:'job',src:'offer',l:'Employer',v:'Northwind Labs, Inc.',keys:{offer:['oemp']}},
  {id:'title',g:'job',src:'offer',l:'Job title',v:'Software Engineer II',keys:{offer:['otitle']}},
  {id:'loc',g:'job',src:'offer',l:'Work location',v:'Austin, Texas, USA',keys:{offer:['oloc']}},
  {id:'start',g:'job',src:'offer',l:'Start date',v:'1 Oct 2027',keys:{offer:['ostart']}},
  {id:'sal',g:'job',src:'offer',l:'Annual salary',v:'US$132,000',keys:{offer:['osal']}}
];
const NAMES = {passport:'Priya Sharma',degree:'Priya R. Sharma'};

let S;
function fresh(){
  return {step:0,maxStep:0,docs:{passport:'idle',degree:'idle',offer:'idle'},plant:true,vals:{},edited:{},confirmed:{},secOk:{},
    editing:null,nameChoice:null,answers:{},consent:false,sent:false,pvDoc:'passport',pvField:null,pvOpen:false,notes:false,
    log:[],t0:Date.now(),tReview:null,dobViewed:false,showErr:false};
}
S = fresh();

function log(msg){const s=Math.round((Date.now()-S.t0)/1000);S.log.push({t:`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`,msg})}
function val(f){
  if(f.id==='name'){
    if(S.nameChoice==='custom') return S.vals.name||'';
    return S.nameChoice?NAMES[S.nameChoice]:'';
  }
  if(S.vals[f.id]!==undefined) return S.vals[f.id];
  if(S.docs[f.src]==='skipped') return '';
  if(f.id==='dob') return S.plant?'17 Aug 1996':'17 Mar 1996';
  return f.v;
}
const skipped = src => S.docs[src]==='skipped';

let saveT;
function touch(){
  const el=document.getElementById('save');el.classList.add('saving');el.querySelector('span').textContent='Saving…';
  clearTimeout(saveT);saveT=setTimeout(()=>{el.classList.remove('saving');el.querySelector('span').textContent='All changes saved'},650);
}

/* ---------- remaining checks on review ---------- */
function remaining(){
  const out=[];
  if(skipped('passport')){ /* name typed */ if(!(S.vals.name||'').trim()) out.push('Type your full name'); }
  else if(!S.nameChoice || (S.nameChoice==='custom' && !(S.vals.name||'').trim())) out.push('Choose how your name should appear');
  ['dob','ppno'].forEach(id=>{const f=FIELDS.find(x=>x.id===id);
    if(skipped(f.src)){ if(!(S.vals[id]||'').trim()) out.push(`Type your ${f.l.toLowerCase()}`) }
    else if(!S.confirmed[id]) out.push(`Confirm your ${f.l.toLowerCase()}`)});
  GROUPS.forEach(g=>{ if(!S.secOk[g.k]) out.push(`Confirm the ${g.t.toLowerCase()} section`) });
  return out;
}

/* ---------- renderers ---------- */
function renderRail(){
  document.getElementById('rail').innerHTML = `<ol>${STEPS.map((t,i)=>{
    const cls = i===S.step?'cur':(i<=S.maxStep && !S.sent?'done':'');
    const done = cls==='done';
    return `<li class="${cls}"><button ${done?`data-a="go" data-i="${i}"`:'tabindex="-1"'} aria-current="${i===S.step?'step':'false'}"><span class="n">${done?ICON.check.replace('viewBox','width="14" height="14" viewBox'):i+1}</span><span class="lbl">${t}</span></button></li>`;
  }).join('')}</ol>
  <div class="meta">About 15 minutes in total. You can leave and come back. Your answers stay saved.</div>`;
}

function welcome(){
  return `<div class="pane">
    <div class="eyebrow">Your work visa application</div>
    <h1>Hi Priya, let's get your visa application started</h1>
    <p class="lede">Northwind Labs has asked its legal team to prepare your H-1B visa petition. Your part is to share some documents and answer a few questions. Most of the details come straight from your documents, so you'll mostly be checking, not typing.</p>
    <div class="facts">
      <div><b>About 15 min</b><span>Most people finish in one go</span></div>
      <div><b>3 documents</b><span>Photos or PDFs both work</span></div>
      <div><b>Saved as you go</b><span>Stop anytime and come back</span></div>
    </div>
    <div>
      <h2 style="margin-bottom:12px">Keep these close by</h2>
      <div class="needs">${Object.values(DOCS).map(d=>`<div class="need">${ICON[d.icon]}<b>${d.t}</b><span>${d.d}</span></div>`).join('')}</div>
    </div>
    <div class="privacy">${ICON.lock}<div><b>Who sees your documents:</b> only the legal team handling your case. Your employer sees your case status, not your documents. You can remove a document at any time before you send.</div></div>
    <div class="row">
      <button class="btn" data-a="go" data-i="1">Start with my documents</button>
      <button class="link" data-a="manual">I'd rather type everything in</button>
    </div>
  </div>`;
}

function docsScreen(){
  const list = Object.entries(DOCS).map(([k,d])=>{
    const st=S.docs[k];
    let mid='',acts='';
    if(st==='idle'){mid=`<div class="d">${d.d}</div>`;acts=`<button class="btn sm" data-a="up" data-k="${k}">Upload</button><button class="link" data-a="skip" data-k="${k}">I don't have it now</button>`}
    if(st==='uploading'||st==='reading'){mid=`<div class="d">${st==='uploading'?'Uploading '+esc(d.file)+'…':'Reading your document…'}</div><div class="bar"><i></i></div>`}
    if(st==='done'){mid=`<div class="st ok">${ICON.check.replace('viewBox','width="15" height="15" viewBox')} ${d.found} details found · <span style="color:var(--muted)">${esc(d.file)}</span></div>`;acts=`<button class="link" data-a="undo" data-k="${k}">Replace</button>`}
    if(st==='skipped'){mid=`<div class="st mut">You'll type these details yourself on the next step. You can still upload it later.</div>`;acts=`<button class="btn sm sec" data-a="up" data-k="${k}">Upload instead</button>`}
    return `<div class="card doccard ${st}"><div class="ic">${ICON[d.icon]}</div><div style="min-width:0"><div class="t">${d.t}</div>${mid}</div><div class="acts">${acts}</div></div>`;
  }).join('');
  const anyIdle = Object.values(S.docs).some(s=>s==='idle');
  return `<div class="pane">
    <div class="eyebrow">Step 2 of 5</div>
    <h1>Add your documents</h1>
    <p class="lede">We'll read each document and fill in your details for you. On the next step you check everything before anything is sent.</p>
    <div class="docs">${list}</div>
    ${anyIdle?`<div><button class="link" data-a="samples">Use sample documents for this demo</button></div>`:''}
    <div class="tips">
      <div>${ICON.check}<span>All four corners visible</span></div>
      <div>${ICON.check}<span>No glare or shadows on the text</span></div>
      <div>${ICON.check}<span>A phone photo is fine</span></div>
    </div>
  </div>`;
}

function srcBtn(src,f){
  const on = S.pvDoc===src && S.pvField===f.id;
  return `<button class="src ${on?'on':''}" data-a="show" data-src="${src}" data-f="${f.id}" aria-label="Show where this came from in your ${DOCS[src].t.toLowerCase()}">${ICON.doc}${DOCS[src].t}</button>`;
}

function nameRow(f){
  if(skipped('passport')){
    return `<div class="f crit"><div class="lb">${f.l}<small>Key detail</small></div><div><input class="inp" id="in-name" data-type="name" value="${esc(S.vals.name||'')}" placeholder="Exactly as on your passport"></div><div class="a"></div></div>`;
  }
  if(!S.nameChoice || S.editing==='name'){
    const r=(k,b,s)=>`<label class="choice"><input type="radio" name="namechoice" value="${k}" ${S.nameChoice===k?'checked':''}><div><b>${b}</b><span>${s}</span></div></label>`;
    return `<div class="f crit">
      <div class="lb">${f.l}<small>Key detail</small></div>
      <div class="v"><span class="pill warn">${ICON.warn} Please check</span></div>
      <div class="a">${srcBtn('passport',f)}${skipped('degree')?'':srcBtn('degree',f)}</div>
      <div class="mismatch"><div><small>On your passport</small><b>SHARMA, PRIYA</b></div><div><small>On your degree certificate</small><b>Priya R. Sharma</b></div></div>
      <div class="choices">
        ${r('passport','Priya Sharma','As on your passport. Recommended, because visa forms must match your passport exactly.')}
        ${r('degree','Priya R. Sharma','As on your degree certificate')}
        ${r('custom','Something else','I’ll type my legal name')}
        ${S.nameChoice==='custom'?`<input class="inp" id="in-name" data-type="name" value="${esc(S.vals.name||'')}" placeholder="Your full legal name">`:''}
      </div>
      <div class="note warn">${ICON.info}<span>When names differ across documents, your legal team usually has to ask you about it later. Choosing now saves that back-and-forth.</span></div>
    </div>`;
  }
  return `<div class="f crit"><div class="lb">${f.l}<small>Key detail</small></div><div class="v">${esc(val(f))}</div>
    <div class="a">${srcBtn('passport',f)}<span class="pill ok">${ICON.check} Confirmed</span><button class="link" data-a="edit" data-f="name">Change</button></div></div>`;
}

function fieldRow(f){
  if(f.id==='name') return nameRow(f);
  const sk=skipped(f.src);
  const v=val(f);
  let mid, acts='';
  if(sk){
    mid=`<input class="inp" id="in-${f.id}" data-type="field" data-f="${f.id}" value="${esc(S.vals[f.id]||'')}" placeholder="Type this in">`;
  } else if(S.editing===f.id){
    mid=`<div class="editrow"><input class="inp" id="ed-${f.id}" value="${esc(v)}"><button class="btn sm" data-a="saveEdit" data-f="${f.id}">Save</button><button class="link" data-a="cancelEdit">Cancel</button></div>`;
  } else {
    mid=`<div class="v">${esc(v)}${S.edited[f.id]?'<span class="ed">changed by you</span>':''}</div>`;
    acts = srcBtn(f.src,f);
    if(f.crit){
      acts += S.confirmed[f.id]
        ? `<span class="pill ok">${ICON.check} Confirmed</span><button class="link" data-a="edit" data-f="${f.id}">Change</button>`
        : `<button class="link" data-a="edit" data-f="${f.id}">Edit</button><button class="btn sm" data-a="confirm" data-f="${f.id}">Confirm</button>`;
    } else {
      acts += `<button class="link" data-a="edit" data-f="${f.id}">Edit</button>`;
    }
  }
  let note='';
  if(f.heads && !sk) note=`<div class="note info">${ICON.info}<span><b>Heads up:</b> your passport expires on 14 Mar 2027, before your expected start date of 1 Oct 2027. Your legal team may ask you to renew it. You don't need to do anything right now.</span></div>`;
  return `<div class="f ${f.crit?'crit':''}"><div class="lb">${f.l}${f.crit?'<small>Key detail</small>':''}</div><div style="min-width:0">${mid}</div><div class="a">${acts}</div>${note}</div>`;
}

function review(){
  const filled = FIELDS.filter(f=>!skipped(f.src)).length;
  const rem = remaining();
  const groups = GROUPS.map(g=>{
    const fs=FIELDS.filter(f=>f.g===g.k);
    const sk=skipped(g.src);
    const nonCrit = fs.filter(f=>!f.crit);
    const typedOk = !sk || nonCrit.every(f=>(S.vals[f.id]||'').trim());
    const foot = S.secOk[g.k]
      ? `<span class="pill ok">${ICON.check} Section confirmed</span><button class="link" data-a="unsec" data-g="${g.k}">Undo</button>`
      : `<span style="font-size:13px;color:var(--muted)">${fs.some(f=>f.crit)?'Key details above are confirmed one by one. ':''}${sk?'Fill in each detail, then confirm.':'Compare with your document, then confirm.'}</span><button class="btn sm sec" data-a="sec" data-g="${g.k}" ${typedOk?'':'disabled'}>These look right</button>`;
    return `<section class="card"><div class="ch"><h2>${g.t}</h2>${sk?`<span class="pill mut">Typed by you</span>`:`<span class="pill mut">${ICON.doc} From your ${DOCS[g.src].t.toLowerCase()}</span>`}</div>
      <div class="fields">${fs.map(fieldRow).join('')}</div><div class="cf">${foot}</div></section>`;
  }).join('');
  const toCheck = skipped('passport')?0:(S.nameChoice?0:1);
  return `<div class="pane">
    <div class="eyebrow">Step 3 of 5</div>
    <h1>Check what we filled in</h1>
    <p class="lede">We read your documents and filled in ${filled} details. Select a document tag to see exactly where a detail came from. You can change anything.</p>
    <div class="sum">
      <span class="pill ok">${ICON.check} ${filled-toCheck} filled in</span>
      ${toCheck?`<span class="pill warn">${ICON.warn} ${toCheck} to check</span>`:''}
      ${skipped('passport')?'':`<span class="pill info">${ICON.info} 1 heads up</span>`}
      <span class="pill mut">${rem.length?rem.length+' left to confirm':'All confirmed'}</span>
    </div>
    ${groups}
  </div>`;
}

function questions(){
  const a=S.answers;
  const radio=(name,opts)=>`<div class="opts">${opts.map(([v,l])=>`<label class="opt"><input type="radio" name="${name}" value="${v}" ${a[name]===v?'checked':''}>${l}</label>`).join('')}</div>`;
  const why=t=>`<p class="why">${ICON.info}<span><b>Why we ask:</b> ${t}</span></p>`;
  const miss=k=>S.showErr && !(a[k]||'').toString().trim()?`<p class="err">Please answer this to continue.</p>`:'';
  return `<div class="pane">
    <div class="eyebrow">Step 4 of 5</div>
    <h1>A few questions your documents can't answer</h1>
    <p class="lede">Only 4 questions. Some may open a short follow-up depending on your answer.</p>
    <section class="card">
      <div class="q"><label class="ql" for="q-address">Your current home address</label>
        <textarea class="inp" id="q-address" data-q="address" rows="2" placeholder="Street, city, PIN code">${esc(a.address||'')}</textarea>
        ${why('your legal team uses it to send official mail, and it appears on your visa forms.')}${miss('address')}</div>
      <div class="q"><span class="ql" style="font-weight:600">Are you married?</span>
        ${radio('marital',[['no','No'],['yes','Yes']])}
        ${a.marital==='yes'?`<div class="sub"><label for="q-spouse">Spouse's full name</label><input class="inp" id="q-spouse" data-q="spouse" value="${esc(a.spouse||'')}">
          <span style="font-weight:500">Will your spouse move to the US with you?</span>${radio('spouseMove',[['yes','Yes'],['no','No'],['unsure','Not sure yet']])}</div>`:''}
        ${why('if your family is moving with you, your legal team can prepare their visas at the same time.')}${miss('marital')}</div>
      <div class="q"><span class="ql" style="font-weight:600">Have you been to the US before?</span>
        ${radio('usBefore',[['no','No'],['yes','Yes']])}
        ${a.usBefore==='yes'?`<div class="sub"><div class="two">
          <div style="display:grid;gap:6px"><label for="q-usvisa">Visa you used last time</label><select class="inp" id="q-usvisa" data-q="usVisa"><option value="">Choose one</option>${['F-1 (student)','B-1/B-2 (visitor)','J-1 (exchange)','Other or not sure'].map(o=>`<option ${a.usVisa===o?'selected':''}>${o}</option>`).join('')}</select></div>
          <div style="display:grid;gap:6px"><label for="q-uslast">Month and year you last left the US</label><input class="inp" id="q-uslast" data-q="usLast" placeholder="e.g. May 2025" value="${esc(a.usLast||'')}"></div>
        </div></div>`:''}
        ${why('past visits and visa types affect which forms your legal team files.')}${miss('usBefore')}</div>
      <div class="q"><span class="ql" style="font-weight:600">Has any country ever refused you a visa?</span>
        ${radio('refused',[['no','No'],['yes','Yes']])}
        ${a.refused==='yes'?`<div class="sub"><label for="q-refwhy">Tell us briefly what happened</label><textarea class="inp" id="q-refwhy" data-q="refWhy" rows="3" placeholder="Country, year, and the reason if you know it">${esc(a.refWhy||'')}</textarea>
          <p class="why">${ICON.info}<span>A past refusal does not mean this application will be refused. Telling your legal team now lets them prepare for it.</span></p></div>`:''}
        ${why('visa forms ask this directly, and an honest answer protects your application.')}${miss('refused')}</div>
    </section>
    <div><button class="link" data-a="fillQ">Fill sample answers for this demo</button></div>
  </div>`;
}

function submit(){
  if(S.sent){
    const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));
    return `<div class="pane">
      <div class="big-ok">${ICON.check}</div>
      <h1>Sent to your legal team</h1>
      <p class="lede">Thanks, Priya. You don't need to do anything else right now. Here's what happens next.</p>
      <section class="card"><div class="cb"><ol class="steps">
        <li><span class="n">1</span><div><b>Your legal team reviews your details</b><span>Usually within 3 to 5 business days.</span></div></li>
        <li><span class="n">2</span><div><b>If anything is missing, you'll get one email</b><span>It will say exactly what's needed and why, with a link straight to that item.</span></div></li>
        <li><span class="n">3</span><div><b>Your petition is prepared and filed</b><span>You'll see each stage on this page, and Northwind Labs sees the same status.</span></div></li>
      </ol></div></section>
      <p style="font-size:13px;color:var(--muted)">Demo session time: about ${mins} min.</p>
      <div><button class="btn sec" data-a="restart">Start the demo again</button></div>
    </div>`;
  }
  const a=S.answers, F=id=>val(FIELDS.find(f=>f.id===id));
  const item=(l,v)=>`<div><small>${l}</small><b>${esc(v||'Not provided')}</b></div>`;
  const yn=v=>v==='yes'?'Yes':v==='no'?'No':'';
  return `<div class="pane">
    <div class="eyebrow">Step 5 of 5</div>
    <h1>Review and send</h1>
    <p class="lede">This goes to the legal team preparing your petition. They'll contact you if they need anything else.</p>
    <section class="card"><div class="ch"><h2>About you</h2><button class="link" data-a="go" data-i="2">Edit</button></div>
      <div class="cb dl">${item('Full name',F('name'))}${item('Date of birth',F('dob'))}${item('Passport number',F('ppno'))}${item('Passport expires',F('doe'))}</div></section>
    <section class="card"><div class="ch"><h2>Education and job</h2><button class="link" data-a="go" data-i="2">Edit</button></div>
      <div class="cb dl">${item('Degree',[F('deg'),F('major')].filter(Boolean).join(', '))}${item('University',F('uni'))}${item('Employer',F('emp'))}${item('Start date',F('start'))}</div></section>
    <section class="card"><div class="ch"><h2>Your answers</h2><button class="link" data-a="go" data-i="3">Edit</button></div>
      <div class="cb dl">${item('Home address',a.address)}${item('Married',yn(a.marital))}${item('Been to the US before',yn(a.usBefore))}${item('Refused a visa before',yn(a.refused))}</div></section>
    <label class="consent"><input type="checkbox" id="consent" ${S.consent?'checked':''}><span>I confirm these details are correct and complete as far as I know.</span></label>
  </div>`;
}

/* ---------- document viewer ---------- */
function hl(doc,key){
  if(!S.pvField || S.pvDoc!==doc) return '';
  const f=FIELDS.find(x=>x.id===S.pvField);
  return (f.keys[doc]||[]).includes(key)?' hl':'';
}
function passportDoc(){
  const k=key=>`class="k${hl('passport',key)}"`;
  const m1=('P<INDSHARMA<<PRIYA').padEnd(44,'<');
  const m2=('Z4831207<4IND9603172F2703148').padEnd(42,'<')+'02';
  return `<div class="doc"><div class="wm">SPECIMEN</div>
    <div class="pp-top"><span>REPUBLIC OF INDIA</span><span>PASSPORT</span></div>
    <div class="pp-body"><div class="photo"></div><div class="pf">
      <div><small>Type</small><b>P</b></div><div ${k('ppno')}><small>Passport No.</small><b>Z4831207</b></div>
      <div class="w k${hl('passport','surname')}"><small>Surname</small><b>SHARMA</b></div>
      <div class="w k${hl('passport','given')}"><small>Given name(s)</small><b>PRIYA</b></div>
      <div ${k('nat')}><small>Nationality</small><b>INDIAN</b></div><div ${k('sex')}><small>Sex</small><b>F</b></div>
      <div ${k('dob')}><small>Date of birth</small><b>17/03/1996</b></div><div ${k('pob')}><small>Place of birth</small><b>PUNE, MAHARASHTRA</b></div>
      <div ${k('doi')}><small>Date of issue</small><b>15/03/2017</b></div><div ${k('doe')}><small>Date of expiry</small><b>14/03/2027</b></div>
    </div></div>
    <div class="mrz"><span>${m1}</span>\n<span class="k${hl('passport','mrz')}">${m2}</span></div>
  </div>`;
}
function degreeDoc(){
  const k=key=>`class="k${hl('degree',key)}"`;
  return `<div class="doc"><div class="wm">SPECIMEN</div><div class="cert">
    <div ${k('duni')}><span class="u">Savitribai Phule Pune University</span></div>
    <div class="s">This is to certify that</div>
    <div ${k('dname')}><span class="nm">Priya R. Sharma</span></div>
    <div class="s">has been admitted to the degree of</div>
    <div ${k('ddeg')}><b style="font-size:14px">Bachelor of Engineering</b></div>
    <div ${k('dmajor')}>(Computer Engineering)</div>
    <div class="s" ${k('dgrad')}>at the examination held in June 2018</div>
  </div></div>`;
}
function offerDoc(){
  const k=key=>`class="k${hl('offer',key)}"`;
  return `<div class="doc"><div class="wm">SPECIMEN</div><div class="letter">
    <div class="lh"><span ${k('oemp')}>Northwind Labs, Inc.</span></div>
    <div>12 August 2026</div><div>Dear Priya,</div>
    <div>We are pleased to offer you the position of <span ${k('otitle')}><b>Software Engineer II</b></span>, based in our office in <span ${k('oloc')}>Austin, Texas, USA</span>.</div>
    <div>Your expected start date is <span ${k('ostart')}>October 1, 2027</span>, subject to approval of your H-1B petition. Your annual base salary will be <span ${k('osal')}>US$132,000</span>.</div>
    <div>We look forward to welcoming you to the team.</div>
  </div></div>`;
}
function renderPreview(){
  const el=document.getElementById('preview');
  if(S.step!==2){el.innerHTML='';el.classList.remove('open');return}
  const avail=Object.keys(DOCS).filter(d=>!skipped(d));
  if(!avail.length){el.innerHTML=`<div class="pv"><p class="pvcap">No documents uploaded. You're typing every detail yourself.</p></div>`;return}
  if(!avail.includes(S.pvDoc)) S.pvDoc=avail[0];
  const f=S.pvField && FIELDS.find(x=>x.id===S.pvField);
  const body={passport:passportDoc,degree:degreeDoc,offer:offerDoc}[S.pvDoc]();
  el.innerHTML=`<div class="pv">
    <div class="pvh"><div class="tabs" role="tablist">${avail.map(d=>`<button role="tab" aria-selected="${S.pvDoc===d}" data-a="tab" data-src="${d}">${DOCS[d].t}</button>`).join('')}</div>
      <button class="x" data-a="closePv" aria-label="Close document">${ICON.x}</button></div>
    <p class="pvcap">${f && S.pvDoc in f.keys?`Highlighted: <b>${f.l}</b>. Compare it with what we filled in.`:'Select a document tag next to any detail to see where it came from.'}</p>
    ${body}
  </div>`;
  el.classList.toggle('open',S.pvOpen);
}

/* ---------- footer ---------- */
function renderFoot(){
  const foot=document.getElementById('foot'), inn=document.getElementById('footIn');
  let html='';
  if(S.step===1){
    const busy=Object.values(S.docs).some(s=>s==='uploading'||s==='reading');
    const idle=Object.values(S.docs).filter(s=>s==='idle').length;
    html=`<button class="link" data-a="go" data-i="0">Back</button><div class="row"><span class="msg">${busy?'Reading your documents…':idle?`<b>${idle}</b> document${idle>1?'s':''} left to add or skip`:'All set'}</span><button class="btn" data-a="go" data-i="2" ${busy||idle?'disabled':''}>Continue</button></div>`;
  } else if(S.step===2){
    const rem=remaining();
    html=`<button class="link" data-a="go" data-i="1">Back</button><div class="row"><span class="msg">${rem.length?`<b>${rem.length} left:</b> ${esc(rem[0])}${rem.length>1?' and more':''}`:'Everything is confirmed'}</span><button class="btn" data-a="go" data-i="3" ${rem.length?'disabled':''}>Continue</button></div>`;
  } else if(S.step===3){
    html=`<button class="link" data-a="go" data-i="2">Back</button><button class="btn" data-a="qNext">Continue</button>`;
  } else if(S.step===4 && !S.sent){
    html=`<button class="link" data-a="go" data-i="3">Back</button><button class="btn" data-a="send" ${S.consent?'':'disabled'}>Send to my legal team</button>`;
  }
  foot.hidden=!html; inn.innerHTML=html;
}

/* ---------- design notes ---------- */
const NOTES = [
  [['Set expectations before asking for anything','Most of the anxiety in a visa application comes from not knowing what is coming. The first screen says how long it takes, what to have ready, and that progress is saved.'],
   ['Privacy before the passport','People are about to upload their passport. Saying who sees it, before they are asked, answers the question they are already asking.'],
   ['An escape hatch','Not everyone has scans ready. "I’d rather type everything in" keeps a manual path open, so the AI step is a shortcut, never a gate.']],
  [['Documents first, questions second','Most of the questionnaire is copied from documents people already have. Reading the documents turns typing into checking, which is faster and introduces fewer typos.'],
   ['Every document can be skipped','A missing document should not block the whole flow. Skipped documents become typed fields on the next step.'],
   ['Visible progress while reading','Upload and reading states are shown separately so a few seconds of waiting doesn’t look like something broke.']],
  [['Every value shows its source','Tapping a document tag highlights where the value came from. This is the traceability the product team described: the person stays the source of truth, the AI shows its work.'],
   ['Three states, not one','Filled in (clear match), Please check (a real conflict, such as two spellings of a name), and Heads up (information that needs no action now, such as an expiring passport).'],
   ['Confirm key details one by one','Name, date of birth and passport number are confirmed individually. Everything else is confirmed per section. Confirming every field one by one makes people click without reading. Confirming everything at once makes errors easy to miss.'],
   ['The deliberate error','The date of birth is filled in wrong (17 Aug instead of 17 Mar) and shown as a normal value. This tests the riskiest assumption: do people actually check AI-filled answers? The session log in this panel records whether it was caught.']],
  [['Only ask what documents can’t answer','Four questions, each with a one-line reason. Follow-up questions only appear when an answer needs them.'],
   ['Reassure on the scary question','"Has any country refused you a visa?" is where people are most tempted to hide something. The copy explains that a past refusal does not mean this one will be refused.']],
  [['Close the loop','After sending, the applicant sees what happens next and roughly when. Clear next steps should reduce "is anything happening?" emails to the legal team, which is something to measure.'],
   ['What I’d validate next with real data','Completion time, how often key details are edited after being filled in, how often people catch planted errors, and whether clarification requests from the legal team go down.']]
];
function renderDrawer(){
  const d=document.getElementById('drawer'), sc=document.getElementById('scrim');
  d.hidden=!S.notes; sc.hidden=!S.notes;
  document.getElementById('notesBtn').setAttribute('aria-pressed',S.notes);
  if(!S.notes) return;
  let result='Not confirmed yet';
  if(S.confirmed.dob){
    const v=val(FIELDS.find(f=>f.id==='dob'));
    if(!S.plant) result='Error turned off for this session';
    else if(v==='17 Aug 1996') result=`Missed: confirmed the wrong date${S.dobViewed?' after viewing the passport':' without viewing the passport'}`;
    else result=`Caught: changed to ${v}`;
  }
  d.innerHTML=`<div class="dh"><h2>Design notes · ${STEPS[S.step]}</h2><button class="x" data-a="closeNotes" aria-label="Close notes">${ICON.x}</button></div>
  <div class="db">
    ${NOTES[S.step].map(([h,p])=>`<div class="dnote"><h3>${h}</h3><p>${p}</p></div>`).join('')}
    <div class="testbox">
      <div class="eyebrow">Test setup</div>
      <label class="toggle"><input type="checkbox" id="plant" ${S.plant?'checked':''}> Fill in the wrong date of birth</label>
      <p style="font-size:13px"><b>Date of birth check:</b> ${esc(result)}</p>
      <div class="log">${S.log.length?S.log.map(l=>`<div><span class="t">${l.t}</span> ${esc(l.msg)}</div>`).join(''):'<div class="t">The session log fills in as you use the prototype.</div>'}</div>
    </div>
  </div>`;
}

/* ---------- main render ---------- */
function render(){
  renderRail();
  document.getElementById('main').innerHTML=[welcome,docsScreen,review,questions,submit][S.step]();
  document.getElementById('shell').classList.toggle('wp',S.step===2);
  renderPreview(); renderFoot(); renderDrawer();
}
function go(i){
  S.step=i; S.maxStep=Math.max(S.maxStep,i); S.editing=null; S.pvOpen=false; S.showErr=false;
  if(i===2 && !S.tReview){S.tReview=Date.now();log('Opened the review step')}
  render(); window.scrollTo({top:0});
}

/* ---------- uploads ---------- */
function upload(k,delay=0){
  setTimeout(()=>{S.docs[k]='uploading';render();
    setTimeout(()=>{S.docs[k]='reading';render();
      setTimeout(()=>{S.docs[k]='done';log(`${DOCS[k].t} read: ${DOCS[k].found} details found`);touch();render()},1300)},800)},delay);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, f=b.dataset.f;
  switch(a){
    case 'go': go(+b.dataset.i); break;
    case 'manual': Object.keys(S.docs).forEach(k=>S.docs[k]='skipped'); log('Chose to type everything'); go(2); break;
    case 'up': upload(b.dataset.k); break;
    case 'samples': Object.keys(S.docs).forEach((k,i)=>{ if(S.docs[k]==='idle') upload(k,i*450) }); break;
    case 'skip': S.docs[b.dataset.k]='skipped'; log(`Skipped ${DOCS[b.dataset.k].t.toLowerCase()}`); touch(); render(); break;
    case 'undo': S.docs[b.dataset.k]='idle'; render(); break;
    case 'show':
      S.pvDoc=b.dataset.src; S.pvField=f; S.pvOpen=true;
      if(f==='dob' && !S.dobViewed){S.dobViewed=true;log('Opened the passport to check date of birth')}
      render(); break;
    case 'tab': S.pvDoc=b.dataset.src; renderPreview(); break;
    case 'closePv': S.pvOpen=false; renderPreview(); break;
    case 'confirm': {
      S.confirmed[f]=true;
      const fl=FIELDS.find(x=>x.id===f);
      log(`Confirmed ${fl.l.toLowerCase()}: ${val(fl)}`); touch(); render(); break; }
    case 'edit': S.editing=f; render(); const inp=document.getElementById('ed-'+f); if(inp){inp.focus();inp.select()} break;
    case 'cancelEdit': S.editing=null; render(); break;
    case 'saveEdit': {
      const v=document.getElementById('ed-'+f).value.trim(); const fl=FIELDS.find(x=>x.id===f);
      if(v && v!==val(fl)){S.vals[f]=v;S.edited[f]=true;S.confirmed[f]=false;log(`Changed ${fl.l.toLowerCase()} to ${v}`);touch()}
      S.editing=null; render(); break; }
    case 'sec': S.secOk[b.dataset.g]=true; log(`Confirmed the ${GROUPS.find(g=>g.k===b.dataset.g).t.toLowerCase()} section`); touch(); render(); break;
    case 'unsec': S.secOk[b.dataset.g]=false; render(); break;
    case 'fillQ': Object.assign(S.answers,{address:'Flat 4B, Sai Residency, Baner Road, Pune 411045',marital:'no',usBefore:'yes',usVisa:'F-1 (student)',usLast:'May 2024',refused:'no'}); touch(); render(); break;
    case 'qNext': {
      const ok=['address','marital','usBefore','refused'].every(k=>(S.answers[k]||'').trim());
      if(ok){log('Answered the remaining questions');go(4)} else {S.showErr=true;render()} break; }
    case 'send': S.sent=true; log('Sent to the legal team'); touch(); render(); window.scrollTo({top:0}); break;
    case 'notes': S.notes=!S.notes; renderDrawer(); break;
    case 'closeNotes': S.notes=false; renderDrawer(); break;
    case 'restart': { const keep=S.notes; S=fresh(); S.notes=keep; render(); window.scrollTo({top:0}); break; }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='namechoice'){S.nameChoice=t.value;S.editing=null;log(`Chose name: ${t.value==='custom'?'typed own':NAMES[t.value]}`);touch();render();if(t.value==='custom')document.getElementById('in-name')?.focus();return}
  if(t.type==='radio' && t.closest('.q')){S.answers[t.name]=t.value;touch();render();return}
  if(t.id==='consent'){S.consent=t.checked;renderFoot();return}
  if(t.id==='plant'){S.plant=t.checked;S.confirmed.dob=false;delete S.vals.dob;S.edited.dob=false;log(t.checked?'Wrong date of birth turned on':'Wrong date of birth turned off');render();return}
  if(t.dataset.q){S.answers[t.dataset.q]=t.value;touch()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.type==='name'){S.vals.name=t.value;renderFoot();return}
  if(t.dataset.type==='field'){S.vals[t.dataset.f]=t.value;
    const g=FIELDS.find(x=>x.id===t.dataset.f).g;
    const btn=document.querySelector(`[data-a="sec"][data-g="${g}"]`);
    if(btn) btn.disabled=!FIELDS.filter(x=>x.g===g && !x.crit).every(x=>(S.vals[x.id]||'').trim());
    renderFoot();return}
  if(t.dataset.q){S.answers[t.dataset.q]=t.value}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.notes){S.notes=false;renderDrawer()} else if(S.pvOpen){S.pvOpen=false;renderPreview()} }
  if(e.key==='Enter' && e.target.id?.startsWith('ed-')){document.querySelector(`[data-a="saveEdit"][data-f="${e.target.id.slice(3)}"]`)?.click()}
});
render();
</script>
